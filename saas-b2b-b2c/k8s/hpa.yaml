apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: franchise-backend-hpa
  namespace: franchise
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: franchise-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: franchise-frontend-hpa
  namespace: franchise
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: franchise-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70