apiVersion: apps/v1
kind: Deployment
metadata:
  name: franchise-frontend
  namespace: franchise
spec:
  replicas: 2
  selector:
    matchLabels:
      app: franchise-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: franchise-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/REPLACE_WITH_ORG/franchise-saas/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://franchise-backend:8080"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: franchise-frontend
  namespace: franchise
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: franchise-frontend